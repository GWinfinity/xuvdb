[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xuvdb"
description = "Editable sparse voxel volumes with OpenVDB interop, built on quadrants kernels"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "xuvdb contributors" }]
keywords = ["sparse-volumes", "voxel", "openvdb", "nanovdb", "sdf", "physics-simulation", "quadrants"]
dependencies = [
    "numpy",
    "quadrants",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://atomgit.com/allan_/xuvdb"
Repository = "https://atomgit.com/allan_/xuvdb"
Issues = "https://atomgit.com/allan_/xuvdb/issues"
Roadmap = "https://atomgit.com/allan_/xuvdb/blob/main/ROADMAP.md"
Benchmarks = "https://atomgit.com/allan_/xuvdb/blob/main/BENCHMARKS.md"

[project.optional-dependencies]
# engine-side example (examples/test_packages.py) drives a genesis-world simulation
genesis = ["genesis-world"]
# in-memory OpenVDB bridge (to_openvdb / from_openvdb) via the official bindings
openvdb = ["pyopenvdb"]
test = ["pytest"]
torch = ["torch"]

[tool.setuptools.dynamic]
version = { attr = "xuvdb.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xuvdb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
